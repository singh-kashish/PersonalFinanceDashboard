name: Task
description: A unit of work (one issue becomes one branch and one PR)
title: "P?: "
labels: []
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checklist of verifiable outcomes, including which tests must exist.
      value: |
        - [ ] Failing tests written first and committed before the implementation
        - [ ] Typecheck, lint and relevant test suites pass
        - [ ] No unrelated changes in the diff
    validations:
      required: true
  - type: input
    id: spec
    attributes:
      label: Spec reference
      description: Prompt number in docs/PROMPTS.md, or a link.
  - type: input
    id: depends
    attributes:
      label: Depends on
      description: Issue numbers that must be merged first.
