name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    # Same ports as docker-compose.yml, so server/.env.test.example works unchanged.
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flo
          POSTGRES_PASSWORD: flo_local
          POSTGRES_DB: flo_test
        ports:
          - 5443:5432
        options: >-
          --health-cmd "pg_isready -U flo -d flo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Only so `prisma generate` can read the schema. Tests load server/.env.test.
      DATABASE_URL: postgresql://flo:flo_local@localhost:5443/flo_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      # TODO: make blocking once the issue "fix existing server ESLint errors" is merged.
      - name: Lint (non-blocking for now)
        run: npm run lint
        continue-on-error: true
      - name: Create test env file
        run: cp .env.test.example .env.test
      - name: Unit tests
        run: npm run test:unit -- --coverage --coverageDirectory=coverage/unit
      - name: Integration tests
        run: npm run test:int -- --coverage --coverageDirectory=coverage/int
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage
          if-no-files-found: ignore

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      # TODO(P8): the web app has 5 TypeScript and 17 ESLint errors (docs/INSPECTION.md).
      # These steps are non-blocking until issue P8 is merged; then remove continue-on-error.
      - name: Typecheck (non-blocking until P8)
        run: npm run typecheck
        continue-on-error: true
      - name: Lint (non-blocking until P8)
        run: npm run lint
        continue-on-error: true
      - name: Build (non-blocking until P8)
        run: npm run build
        continue-on-error: true

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Non-blocking at first: fix or accept findings, then remove continue-on-error.
      - name: Audit server dependencies (high and above)
        run: npm audit --audit-level=high
        working-directory: server
        continue-on-error: true
      - name: Audit web dependencies (high and above)
        run: npm audit --audit-level=high
        working-directory: web
        continue-on-error: true
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: codeql
    # CodeQL is free on public repos; private repos need GitHub Advanced Security.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
