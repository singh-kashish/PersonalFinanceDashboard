services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: flo-postgres-dev
    ports:
      - "5442:5432"
    environment:
      POSTGRES_USER: flo
      POSTGRES_PASSWORD: flo_local
      POSTGRES_DB: flo_dev
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flo -d flo_dev"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    container_name: flo-postgres-test
    ports:
      - "5443:5432"
    environment:
      POSTGRES_USER: flo
      POSTGRES_PASSWORD: flo_local
      POSTGRES_DB: flo_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flo -d flo_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flo-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata-dev:
